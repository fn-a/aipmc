[package]
name = "aipmc-transport"
version = "0.0.2"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Transport layer of the AIP agent interconnect protocol — supports UART/SPI/WiFi/BLE communication"
keywords = ["aip", "acp", "embedded", "no-std", "transport"]

[lib]
name = "transport"

[dependencies]
basic = { workspace = true }
embedded-io = { workspace = true }
defmt = { workspace = true, optional = true }

[features]
default = []
defmt = ["dep:defmt", "basic/defmt"]
