[package]
name = "aipmc-basic"
version = "0.0.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Core library of the AIP agent interconnect protocol — ACPs protocol implementation based on GB/Z 185 standard"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
heapless = { workspace = true }
log = { workspace = true }
defmt = { workspace = true, optional = true }

[features]
default = ["alloc"]
alloc = ["serde_json/alloc"]
std = ["alloc", "serde_json/std"]
defmt = ["dep:defmt"]
