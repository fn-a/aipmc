[package]
name = "aipmc-esp32"
version = "0.0.2"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "ESP-32 platform adaptation layer for the AIP agent interconnect protocol"
keywords = ["aip", "acp", "esp32", "embedded", "no-std"]

[dependencies]
basic = { workspace = true }
transport = { workspace = true }
defmt = { workspace = true, optional = true }

[features]
default = []
esp32 = []
esp32s2 = []
esp32s3 = []
esp32c3 = []
esp32c6 = []
wifi = []
ble = []
defmt = ["dep:defmt", "basic/defmt", "transport/defmt"]
