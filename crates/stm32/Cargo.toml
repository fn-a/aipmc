[package]
name = "aipmc-stm32"
version = "0.0.1"
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "STM-32 platform adaptation layer for the AIP agent interconnect protocol"
keywords = ["aip", "acp", "stm32", "embedded", "no-std"]

[dependencies]
basic = { workspace = true }
transport = { workspace = true }
defmt = { workspace = true, optional = true }

[features]
default = []
stm32f4 = []
stm32h7 = []
stm32l4 = []
stm32g4 = []
defmt = ["dep:defmt", "basic/defmt", "transport/defmt"]
