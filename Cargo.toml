[package]
name = "aipmc"
version = "0.0.1"
edition = "2024"
authors = ["fn-a <mr.fna.co@gmail.com>"]
repository = "https://github.com/fn-a/aipmc"
description = "AIP (Agent Interconnection Protocol) MCU implementation of the ACPs protocol based on the GB/Z 185 standard"
license = "MIT"
keywords = ["aip", "acp", "embedded", "esp32", "stm32"]

[dependencies]
basic = { workspace = true }
transport = { workspace = true }
esp32 = { path = "crates/esp32", optional = true, package = "aipmc-esp32", version = "0.0.1" }
stm32 = { path = "crates/stm32", optional = true, package = "aipmc-stm32", version = "0.0.1" }

[features]
default = ["std"]
std = ["basic/std"]
esp32 = ["dep:esp32"]
stm32 = ["dep:stm32"]
defmt = ["basic/defmt"]

[workspace]
resolver = "2"
members = [
    "crates/basic",
    "crates/transport",
    "crates/esp32",
    "crates/stm32",
]

exclude = [
    "examples/esp32",
    "examples/stm32",
]

[workspace.package]
version = "0.0.1"
edition = "2024"
authors = ["fn-a <mr.fna.co@gmail.com>"]
license = "MIT"
repository = "https://github.com/fn-a/aipmc"

[workspace.dependencies]
serde = { version = "^1.0", default-features = false, features = ["derive"] }
serde_json = { version = "^1.0", default-features = false, features = ["alloc"] }
heapless = { version = "^0.9", features = ["serde"] }
embedded-io = "^0.7"
embedded-io-async = "^0.7"
log = "^0.4"
defmt = "^1.1"
critical-section = "^1.2"

basic = { path = "crates/basic", package = "aipmc-basic", version = "0.0.1" }
transport = { path = "crates/transport", package = "aipmc-transport", version = "0.0.1" }